name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/flashcard-math-app-2b98vo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pages-deploy
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site was originally set to "deploy from branch", which rejects
      # deployments from any other branch. Switch it to workflow builds.
      - name: Ensure Pages uses workflow builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/pages-response.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $status"
          cat /tmp/pages-response.json || true

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html _site/
          # Keep the existing flag game available at /flags/
          if git fetch origin claude/world-cup-flag-game-m9xwf2 --depth 1 2>/dev/null; then
            mkdir -p _site/flags
            git show FETCH_HEAD:index.html > _site/flags/index.html || rmdir _site/flags
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
