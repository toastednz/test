name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/flashcard-math-app-2b98vo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pages-deploy
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html _site/
          # Keep the existing flag game available at /flags/
          if git fetch origin claude/world-cup-flag-game-m9xwf2 --depth 1 2>/dev/null; then
            mkdir -p _site/flags
            git show FETCH_HEAD:index.html > _site/flags/index.html || rmdir _site/flags
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
